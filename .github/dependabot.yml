version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major upgrades (React 19, react-router 7, TypeScript 7, ...) need planned
    # migrations, so routine version updates stop at minor/patch.
    # Security updates are not affected by this ignore rule.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # Packages with exact peer requirements on each other must move in one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Stay on the Node 22 line until a runtime migration is planned.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
